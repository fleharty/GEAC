[package]
name = "geac"
version = "0.4.53"
edition = "2021"
# Minimum supported Rust version. Bumping this is a deliberate decision — CI
# verifies the crate still builds on exactly this toolchain. 1.88 is required by
# the comfy-table dependency (let-chains); our own code needs 1.87 (is_multiple_of).
rust-version = "1.88"
description = "Genomic Evidence Atlas of Cohorts — collect alt base metrics across sequencing cohorts"
# GEAC is distributed as source/Docker/Homebrew, not published to crates.io.
publish = false

[[bin]]
name = "geac"
path = "src/main.rs"

[dependencies]
# BAM/CRAM parsing via htslib bindings
rust-htslib = { version = "0.47", features = ["serde_feature"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Arrow/Parquet output
arrow = { version = "53", default-features = false, features = ["csv"] }
parquet = { version = "53", default-features = false, features = ["arrow", "snap"] }

# DuckDB for cohort merge
duckdb = { version = "1", features = ["bundled"] }

# Gzip decompression (for .gz annotation files)
flate2 = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Parallelism
rayon = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
