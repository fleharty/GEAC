# cargo-deny configuration — dependency vulnerability and license auditing.
# Run locally with: cargo deny check
# See https://embarkstudios.github.io/cargo-deny/

[graph]
# Check every dependency in the tree regardless of target platform.
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ── Security advisories (RustSec) ────────────────────────────────────────────
# Vulnerabilities, unmaintained crates, and yanked versions fail the build by
# default. Each ignore below is a transitive advisory we cannot fix directly.
[advisories]
ignore = [
    # custom_derive is unmaintained but is a transitive dependency of rust-htslib
    # (our core BAM/CRAM library). No upgrade is available; nothing actionable on
    # our side until rust-htslib drops it.
    { id = "RUSTSEC-2025-0058", reason = "unmaintained; transitive via rust-htslib, no fix available" },
    # paste is no longer maintained but is a transitive dependency of the arrow/
    # parquet stack via proc-macro expansion. No replacement available to us.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained; transitive via parquet, no fix available" },
]

# ── Licenses ─────────────────────────────────────────────────────────────────
# Allowlist of permissive licenses acceptable for GEAC's dependency tree. A crate
# with an OR expression passes if any listed license matches; a crate whose only
# license is absent from this list fails the build. Copyleft (GPL/LGPL/MPL) is
# intentionally NOT allowed, so a new copyleft dependency will surface here.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.8

[licenses.private]
# GEAC itself declares no license and is marked publish = false; skip license
# checking for our own unpublished workspace crate.
ignore = true

# ── Bans (duplicate / unwanted crates) ───────────────────────────────────────
# Duplicate versions are reported as warnings, not hard failures — the arrow/
# parquet stack legitimately pulls in two major versions of several crates.
[bans]
multiple-versions = "warn"
wildcards = "allow"

# ── Sources ──────────────────────────────────────────────────────────────────
# Only crates.io is expected; flag anything from an unknown registry or git repo.
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
