name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # clippy compiles the crate, so it needs the same system deps as the tests.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            clang \
            libclang-dev \
            libbz2-dev \
            liblzma-dev \
            libcurl4-openssl-dev \
            zlib1g-dev \
            libssl-dev \
            libdeflate-dev \
            samtools

      # Pinned, not @stable: clippy gains new lints every release, so a floating
      # toolchain turns -D warnings into spontaneous CI failures on code that
      # never changed. Bump this version deliberately and fix new lints in that PR.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            clang \
            libclang-dev \
            libbz2-dev \
            liblzma-dev \
            libcurl4-openssl-dev \
            zlib1g-dev \
            libssl-dev \
            libdeflate-dev \
            samtools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Caches dependency build artifacts only — it prunes the local crate's
      # output, test binaries, and incremental files before saving, so the cache
      # stays small. The previous approach cached the entire target/ directory,
      # which grew to ~5.7 GB and filled the runner disk on restore.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

  msrv:
    name: MSRV (build on 1.88)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            clang \
            libclang-dev \
            libbz2-dev \
            liblzma-dev \
            libcurl4-openssl-dev \
            zlib1g-dev \
            libssl-dev \
            libdeflate-dev \
            samtools

      # Pinned to the rust-version declared in Cargo.toml. Keep these in sync —
      # this job exists to prove that declaration stays honest as deps change.
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # --locked builds against the committed Cargo.lock, so a dependency bump
      # that raises the real MSRV fails here instead of silently passing.
      - name: Build on MSRV
        run: cargo build --locked

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest app/tests/
